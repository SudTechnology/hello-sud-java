# Supply issued credentials through environment variables; never store secrets here.
sud.app-id=${APP_ID:}
sud.app-secret=${APP_SECRET:}
server.address=${HOST:127.0.0.1}
server.port=${PORT:8000}
# Route missing paths through the common JSON exception handler.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Optional Sud callback verification; local demo requests work without signature headers by default.
sud.verify-callback-signature=${VERIFY_CALLBACK_SIGNATURE:false}
